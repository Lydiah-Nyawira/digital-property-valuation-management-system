<div class="location-picker">
  <label for="coord-input">Paste map link or click map to set location:</label>
  <input type="text" id="coord-input" placeholder="Paste OpenStreetMap link, or click the map below...">

  <div id="map"
       data-lat="{{ initial_lat|default:'' }}"
       data-lng="{{ initial_lng|default:'' }}"
       style="height: 400px; margin-top: 10px;"></div>

  <p>Latitude: <span id="lat-display">Not set</span> | Longitude: <span id="lng-display">Not set</span></p>

  <input type="hidden" id="id_latitude" name="latitude" value="{{ initial_lat|default:'' }}">
  <input type="hidden" id="id_longitude" name="longitude" value="{{ initial_lng|default:'' }}">
</div>

<div class="landmark-picker" style="margin-top: 20px;">
  <label for="landmark-name">Landmark name:</label>
  <input type="text" id="landmark-name" placeholder="e.g. St. Mary's Catholic Church">

  <div class="pin-mode-toggle" style="margin: 10px 0;">
    <label><input type="radio" name="pin-mode" value="property" checked> Set Property</label>
    <label style="margin-left: 15px;"><input type="radio" name="pin-mode" value="landmark"> Set Landmark</label>
  </div>

  <p>Distance to property: <span id="distance-display">Not calculated</span></p>

  <input type="hidden" id="id_landmark_lat" name="landmark_lat" value="">
  <input type="hidden" id="id_landmark_lng" name="landmark_lng" value="">
  <input type="hidden" id="id_route_distance_km" name="route_distance_km" value="">
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  let map, marker, landmarkMarker, routeLine;

  function initMap() {
    const mapDiv = document.getElementById('map');
    if (map) {
      map.remove();
      marker = null;
    }  
    
    const latAttr = mapDiv.dataset.lat;
    const lngAttr = mapDiv.dataset.lng;

    const hasInitial = (latAttr !== '' && lngAttr !== '');
    const initialLat = hasInitial ? parseFloat(latAttr) : null;
    const initialLng = hasInitial ? parseFloat(lngAttr) : null;

    const startCenter = hasInitial ? [initialLat, initialLng] : [-1.286389, 36.817223];
    const startZoom = hasInitial ? 16 : 7;

    map = L.map('map').setView(startCenter, startZoom);

    const osmLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles © Esri',
      maxZoom: 16
    }).addTo(map);

    const satLayer = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      { attribution: 'Tiles © Esri' }
    );

    L.control.layers({ "Default": osmLayer, "Satellite": satLayer }).addTo(map);

    if (hasInitial) {
      setCoords({ lat: initialLat, lng: initialLng });
    }

    map.on('click', (e) => {
      if (getActiveMode() === 'property') {
        setCoords(e.latlng);
      } else {
        setLandmarkCoords(e.latlng);
      }
      maybeCalculateRoute();
    });
  }

  function setCoords(latlng) {
    if (marker) {
      marker.setLatLng(latlng);
    } else {
      marker = L.marker(latlng, { draggable: true }).addTo(map);
      marker.on('dragend', (e) => setCoords(e.target.getLatLng()));
    }
    map.panTo(latlng);
    document.getElementById('id_latitude').value = latlng.lat.toFixed(6);
    document.getElementById('id_longitude').value = latlng.lng.toFixed(6);
    document.getElementById('lat-display').textContent = latlng.lat.toFixed(6);
    document.getElementById('lng-display').textContent = latlng.lng.toFixed(6);
  }

  function getActiveMode() {
    return document.querySelector('input[name="pin-mode"]:checked').value;
  }

  function setLandmarkCoords(latlng) {
    if (landmarkMarker) {
      landmarkMarker.setLatLng(latlng);
    } else {
      landmarkMarker = L.marker(latlng, {
        draggable: true,
        icon: L.icon({
          iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
          iconRetinaUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png',
          shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
          iconSize: [20, 33],
          iconAnchor: [10, 33]
        })
      }).addTo(map);
      landmarkMarker.on('dragend', (e) => {
        setLandmarkCoords(e.target.getLatLng());
        maybeCalculateRoute();
      });
    }
    document.getElementById('id_landmark_lat').value = latlng.lat.toFixed(6);
    document.getElementById('id_landmark_lng').value = latlng.lng.toFixed(6);
  }

  function maybeCalculateRoute() {
    const propLat = document.getElementById('id_latitude').value;
    const propLng = document.getElementById('id_longitude').value;
    const landLat = document.getElementById('id_landmark_lat').value;
    const landLng = document.getElementById('id_landmark_lng').value;

    if (!propLat || !propLng || !landLat || !landLng) {
      return; // wait until both pins are set
    }

    const url = `https://router.project-osrm.org/route/v1/driving/${landLng},${landLat};${propLng},${propLat}?overview=full&geometries=geojson`;

    fetch(url)
      .then(response => response.json())
      .then(data => {
        if (data.code !== 'Ok' || !data.routes || data.routes.length === 0) {
          document.getElementById('distance-display').textContent = 'Route not found';
          return;
        }

        const route = data.routes[0];
        const distanceKm = (route.distance / 1000).toFixed(2);

        document.getElementById('distance-display').textContent = `${distanceKm} km`;
        document.getElementById('id_route_distance_km').value = distanceKm;

        // Draw the route line on the map
        if (routeLine) {
          map.removeLayer(routeLine);
        }
        routeLine = L.geoJSON(route.geometry, {
          style: { color: '#c0562f', weight: 4 }
        }).addTo(map);
      })
      .catch(err => {
        console.error('OSRM routing error:', err);
        document.getElementById('distance-display').textContent = 'Error calculating route';
      });
  }
  
  document.getElementById('coord-input').addEventListener('paste', () => {
    setTimeout(() => {
      const val = document.getElementById('coord-input').value;
      const match = val.match(/(-?\d+\.\d+)[,/](-?\d+\.\d+)/);
      if (match) {
        const latlng = { lat: parseFloat(match[1]), lng: parseFloat(match[2]) };
        map.setZoom(17);
        setCoords(latlng);
      }
    }, 50);
  });

  document.addEventListener('DOMContentLoaded', initMap);
</script>
