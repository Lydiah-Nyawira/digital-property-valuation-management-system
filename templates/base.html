<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}DPVMS{% endblock %}</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            background: #FDF8F3;
            color: #2B2B2B;
        }
        nav {
            background: #2B2B2B;
            padding: 18px 28px;
            display: flex;
            align-items: center;
            gap: 24px;
        }
        nav .brand {
            color: #C1622D;
            font-weight: bold;
            font-size: 18px;
            margin-right: 12px;
        }
        nav a {
            color: #FDF8F3;
            text-decoration: none;
            font-weight: 500;
        }
        nav a:hover {
            color: #C1622D;
        }
        .container {
            padding: 28px;
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            color: #2B2B2B;
            border-bottom: 3px solid #C1622D;
            padding-bottom: 10px;
            display: inline-block;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            background: white;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        th, td {
            padding: 12px;
            border: 1px solid #eee;
            text-align: left;
        }
        th {
            background: #C1622D;
            color: white;
        }
        tr:hover {
            background: #FDF1E8;
        }
        form p {
            margin-bottom: 14px;
        }
        input, select, textarea {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background: #C1622D;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover {
            background: #A5511F;
        }
        a.button-link {
            display: inline-block;
            margin-top: 14px;
            color: #C1622D;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <nav>
        <span class="brand">Nyawira Realground</span>
        <a href="{% url 'assignment_list' %}">Assignments</a>
        <a href="{% url 'create_assignment' %}">New Assignment</a>
        <a href="{% url 'create_property' %}">New Property</a>
        <a href="{% url 'create_client' %}">New Client</a>
    </nav>
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
