<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}DPVMS{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; }
        nav { background: #1b3a2b; padding: 16px 24px; }
        nav a { color: #ffffff; text-decoration: none; margin-right: 20px; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        .container { padding: 24px; }
        table { border-collapse: collapse; width: 100%; background: white; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background: #1b3a2b; color: white; }
        form p { margin-bottom: 12px; }
        button { background: #1b3a2b; color: white; padding: 8px 16px; border: none; cursor: pointer; }
        button:hover { background: #14301f; }
        a.button-link { display: inline-block; margin-top: 12px; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'assignment_list' %}">Assignments</a>
        <a href="{% url 'create_assignment' %}">New Assignment</a>
        <a href="{% url 'create_property' %}">New Property</a>
        <a href="{% url 'create_client' %}">New Client</a>
    </nav>
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
